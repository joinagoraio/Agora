name: Deploy to Hetzner

on:
  push:
    branches:
      - feat/programme-workbench-guidance
      - main
  workflow_dispatch:

concurrency:
  group: hetzner-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Agora to Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync

      - name: Sync to VPS and deploy
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: bash scripts/deploy/from-github.sh
